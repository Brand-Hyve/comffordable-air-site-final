name: Deploy to Vercel

# Manual trigger only.
#
# Client sites deploy through Vercel's own GitHub integration, which already
# rebuilds on every push. Leaving this on `push` would run a second, competing
# deploy for the same commit. Run this from the Actions tab when you want a
# deliberate clean rebuild from CI.
#
# Requires VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repo secrets.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
